<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="creativeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF5722;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8A65;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB74D;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background star shape -->
  <polygon points="100,10 123,67 185,67 138,108 154,170 100,135 46,170 62,108 15,67 77,67" 
           fill="url(#creativeGradient)" 
           stroke="#E64A19" 
           stroke-width="3"/>
  
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="45" fill="url(#accentGradient2)" stroke="#FF9800" stroke-width="2"/>
  
  <!-- Creative symbols -->
  <text x="100" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#E64A19" font-weight="bold">
    🎨
  </text>
  <text x="100" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E64A19" font-weight="bold">
    ART
  </text>
  
  <!-- Decorative elements -->
  <circle cx="70" cy="70" r="6" fill="#FF8A65" opacity="0.8"/>
  <circle cx="130" cy="70" r="6" fill="#FF8A65" opacity="0.8"/>
  <circle cx="70" cy="130" r="6" fill="#FF8A65" opacity="0.8"/>
  <circle cx="130" cy="130" r="6" fill="#FF8A65" opacity="0.8"/>
  
  <!-- Center dot -->
  <circle cx="100" cy="100" r="5" fill="#E64A19" stroke="#FF8A65" stroke-width="2"/>
  
  <!-- Sparkle effects -->
  <polygon points="100,25 102,30 107,30 103,35 105,40 100,37 95,40 97,35 93,30 98,30" 
           fill="#FFB74D" opacity="0.8"/>
  <polygon points="175,100 170,102 170,107 165,103 160,105 163,100 160,95 165,97 170,93 170,98" 
           fill="#FFB74D" opacity="0.8"/>
  <polygon points="100,175 95,170 90,170 94,165 92,160 97,163 102,160 100,165 105,170 100,170" 
           fill="#FFB74D" opacity="0.8"/>
  <polygon points="25,100 30,95 30,90 35,94 40,92 37,97 40,102 35,100 30,105 30,100" 
           fill="#FFB74D" opacity="0.8"/>
</svg>
