<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="financeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#81C784;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFEB3B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background octagon -->
  <polygon points="100,15 170,35 185,100 170,165 100,185 30,165 15,100 30,35" 
           fill="url(#financeGradient)" 
           stroke="#2E7D32" 
           stroke-width="3"/>
  
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="50" fill="url(#goldGradient)" stroke="#FFA000" stroke-width="2"/>
  
  <!-- Finance symbols -->
  <text x="100" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#2E7D32" font-weight="bold">
    💰
  </text>
  <text x="100" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2E7D32" font-weight="bold">
    FIN
  </text>
  
  <!-- Corner elements -->
  <circle cx="50" cy="50" r="8" fill="#81C784" opacity="0.8"/>
  <circle cx="150" cy="50" r="8" fill="#81C784" opacity="0.8"/>
  <circle cx="50" cy="150" r="8" fill="#81C784" opacity="0.8"/>
  <circle cx="150" cy="150" r="8" fill="#81C784" opacity="0.8"/>
  
  <!-- Center dot -->
  <circle cx="100" cy="100" r="6" fill="#2E7D32" stroke="#81C784" stroke-width="2"/>
  
  <!-- Decorative lines -->
  <line x1="70" y1="70" x2="130" y2="130" stroke="#2E7D32" stroke-width="1" opacity="0.3"/>
  <line x1="130" y1="70" x2="70" y2="130" stroke="#2E7D32" stroke-width="1" opacity="0.3"/>
</svg>
