<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="treeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E7D32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="trunkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8D6E63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A1887F;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#treeGradient)" stroke="#1B5E20" stroke-width="3"/>
  
  <!-- Tree trunk -->
  <rect x="85" y="120" width="30" height="50" fill="url(#trunkGradient)" rx="5"/>
  
  <!-- Tree leaves (circles) -->
  <circle cx="100" cy="80" r="35" fill="#4CAF50" opacity="0.9"/>
  <circle cx="80" cy="90" r="25" fill="#66BB6A" opacity="0.8"/>
  <circle cx="120" cy="90" r="25" fill="#66BB6A" opacity="0.8"/>
  <circle cx="100" cy="60" r="20" fill="#81C784" opacity="0.7"/>
  
  <!-- Tea leaf accent -->
  <ellipse cx="70" cy="70" rx="8" ry="15" fill="#2E7D32" opacity="0.8" transform="rotate(-30 70 70)"/>
  <ellipse cx="130" cy="70" rx="8" ry="15" fill="#2E7D32" opacity="0.8" transform="rotate(30 130 70)"/>
  
  <!-- Center dot -->
  <circle cx="100" cy="100" r="8" fill="#FFD700" stroke="#FFA000" stroke-width="2"/>
  
  <!-- Text -->
  <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">
    TEA LEAVES
  </text>
</svg>
