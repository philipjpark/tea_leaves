<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="techGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64B5F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BCD4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4DD0E1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background square with rounded corners -->
  <rect x="20" y="20" width="160" height="160" rx="20" ry="20"
        fill="url(#techGradient)" 
        stroke="#1976D2" 
        stroke-width="3"/>
  
  <!-- Inner diamond -->
  <polygon points="100,40 160,100 100,160 40,100" 
           fill="url(#accentGradient)" 
           stroke="#00BCD4" 
           stroke-width="2"/>
  
  <!-- Tech circuit elements -->
  <rect x="80" y="80" width="40" height="40" fill="#1976D2" rx="5"/>
  <circle cx="100" cy="100" r="15" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  
  <!-- Circuit lines -->
  <line x1="60" y1="100" x2="80" y2="100" stroke="#1976D2" stroke-width="3"/>
  <line x1="120" y1="100" x2="140" y2="100" stroke="#1976D2" stroke-width="3"/>
  <line x1="100" y1="60" x2="100" y2="80" stroke="#1976D2" stroke-width="3"/>
  <line x1="100" y1="120" x2="100" y2="140" stroke="#1976D2" stroke-width="3"/>
  
  <!-- Corner dots -->
  <circle cx="60" cy="60" r="6" fill="#64B5F6"/>
  <circle cx="140" cy="60" r="6" fill="#64B5F6"/>
  <circle cx="60" cy="140" r="6" fill="#64B5F6"/>
  <circle cx="140" cy="140" r="6" fill="#64B5F6"/>
  
  <!-- Center symbol -->
  <text x="100" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1976D2" font-weight="bold">
    ⚡
  </text>
</svg>
